# tmux: one session per project, windows are the tabs. Ghostty stays one tab.
# Set up 2026-10-02. Reference: `man tmux`; defaults: `tmux show -g`.

# Prefix Ctrl-A (Ctrl-B is a reach). Ctrl-A Ctrl-A sends a literal Ctrl-A
# through, for nvim's increment.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Terminal: true colour under Ghostty, no ESC delay (vi mode in zsh/nvim),
# focus events so nvim notices tab switches, clipboard via OSC 52.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB"
set -s escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g mouse on
set -g history-limit 50000
setw -g mode-keys vi

# Windows numbered from 1 (prefix 1..9 matches the keyboard), close gaps.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Closing a session's last window (Ctrl-D) moves to the most recently used
# other session instead of dropping out of tmux. Prefix d still detaches.
set -g detach-on-destroy off

# Window name = running command, except Claude Code: `claude` is a launcher
# that execs ~/.local/share/claude/versions/N.N.N, so its process name is a
# bare version number. When the command looks like one, use the pane title
# instead (Claude sets it to the conversation topic, "✳ " prefix stripped).
set -g automatic-rename-format \
  '#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{s/^✳ //:pane_title},#{pane_current_command}}'

# Rule: a key skips the prefix only if programs never see it (Cmd, Ctrl-Tab;
# Ghostty types the prefix for those). Ctrl-letters reach zsh/nvim, so they
# stay behind Ctrl-A.
# Browser-style keys (2026-10-05): t = new tab (window), n = new session,
# Tab / Shift-Tab = next / previous tab (Ghostty turns Ctrl-Tab into
# Ctrl-A Tab, see .config/ghostty/config). The screen-era c and p stay as
# spares. New windows/splits open in the current pane's directory.
bind t new-window -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind Tab next-window
bind BTab previous-window
# Splits match nvim's Ctrl-W v / Ctrl-W s (unshifted: home-row mods make
# Ctrl-A then Shift-| a three-step chord). `s` was the sessions tree; `w`
# (windows tree, default) shows sessions too.
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Prefix n: the command prompt pre-filled with `new -A -s `, so typing a name
# and Enter creates that session, or switches to it if it exists (-A); the
# in-tmux twin of the shell's `t NAME`. Backspace over it for any other
# command. Replaces the default next-window (now Tab). Ctrl-C cancels (Esc is
# vi normal mode).
bind n command-prompt -I "new -A -s "

# Popup borders rounded (prefix ? uses tmux's border).
set -g popup-border-lines rounded

# Prefix F: fuzzy jump to any window in any session (what Ghostty tabs lacked).
# Prefix W (default) is the tree view of the same thing.
# The box is fzf's, not tmux's (-B): with status-position top, tmux 3.7c lets a
# scrolling pane underneath overwrite the popup's first row, which ate the top
# border. --margin=1,0,0,0 gives that row up as blank space instead. Full
# height and one border override FZF_DEFAULT_OPTS (60%, a second box);
# empty --pointer/--marker drop fzf's left columns (the bar and the red tick),
# so the current row is just bold on grey.
bind f display-popup -B -E -w 60% -h 50% \
  "tmux list-windows -a -F '#S:#I  #W  (#{pane_current_command})' \
   | fzf --reverse --no-info --height=100% --pointer='' --marker='' \
         --border=rounded --color=border:-1 --margin=1,0,0,0 \
   | cut -d' ' -f1 | xargs -r tmux switch-client -t"

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Ctrl mirrors: Ctrl-A Ctrl-X does what Ctrl-A X does, so the prefix hand
# never has to lift. Only in the after-prefix table; bare Ctrl-X is untouched.
# (C-z replaces the default suspend-client, never wanted.)
bind C-t new-window -c "#{pane_current_path}"
bind C-c new-window -c "#{pane_current_path}"
bind C-n command-prompt -I "new -A -s "
bind C-p previous-window
bind C-w choose-tree -Zw
bind C-d detach-client
bind C-v split-window -h -c "#{pane_current_path}"
bind C-s split-window -v -c "#{pane_current_path}"
bind C-x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind C-z resize-pane -Z
bind C-f display-popup -B -E -w 60% -h 50% \
  "tmux list-windows -a -F '#S:#I  #W  (#{pane_current_command})' \
   | fzf --reverse --no-info --height=100% --pointer='' --marker='' \
         --border=rounded --color=border:-1 --margin=1,0,0,0 \
   | cut -d' ' -f1 | xargs -r tmux switch-client -t"

# Prefix ?: the cheat sheet, same as `cheat tmux` (replaces the default list-keys dump; that is
# still `:list-keys`).
bind ? display-popup -E -w 90% -h 80% "less -R ~/dotfiles/cheats/tmux.md"

# Status bar on top, under Ghostty's tab bar. Transparent so the background
# image shows; colours are ANSI slots so it follows the from-image theme.
# Session name left, windows after it, nothing on the right.
set -g status-position top
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=colour4,bold] #S  "
set -g status-left-length 30
set -g status-right ""
set -g status-justify left
setw -g window-status-separator ""
setw -g window-status-format "#[fg=colour8] #I #W "
setw -g window-status-current-format "#[fg=colour4,bold] #I #W "
# The prompt (prefix t / :) and messages replace the status line; tmux's
# default is a black-on-yellow bar. Plain bold instead; not bold once Esc puts
# the prompt in vi normal mode. fill=terminal blanks the rest of the line
# (without it the window list shows through after the text).
set -g message-style "bg=default,fg=default,bold,fill=terminal"
set -g message-command-style "bg=default,fg=default,fill=terminal"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=white"
