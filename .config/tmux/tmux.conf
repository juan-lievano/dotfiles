# tmux: one session per project, windows are the tabs. Ghostty stays one tab.
# Set up 2026-10-02. Reference: `man tmux`; defaults: `tmux show -g`.

# Prefix Ctrl-A (Ctrl-B is a reach). Ctrl-A Ctrl-A sends a literal Ctrl-A
# through, for nvim's increment.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Terminal: true colour under Ghostty, no ESC delay (vi mode in zsh/nvim),
# focus events so nvim notices tab switches, clipboard via OSC 52.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB"
set -s escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g mouse on
set -g history-limit 50000
setw -g mode-keys vi

# Windows numbered from 1 (prefix 1..9 matches the keyboard), close gaps.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New windows/splits open in the current pane's directory.
bind c new-window -c "#{pane_current_path}"
# Splits match nvim's Ctrl-W v / Ctrl-W s (unshifted: home-row mods make
# Ctrl-A then Shift-| a three-step chord). `s` was the sessions tree; `w`
# (windows tree, default) shows sessions too.
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Prefix F: fuzzy jump to any window in any session (what Ghostty tabs lacked).
# Prefix W (default) is the tree view of the same thing.
bind f display-popup -E -w 60% -h 50% \
  "tmux list-windows -a -F '#S:#I  #W  (#{pane_current_command})' \
   | fzf --reverse --no-info | cut -d' ' -f1 | xargs -r tmux switch-client -t"

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Ctrl mirrors: Ctrl-A Ctrl-X does what Ctrl-A X does, so the prefix hand
# never has to lift. Only in the after-prefix table; bare Ctrl-X is untouched.
# (C-z replaces the default suspend-client, never wanted.)
bind C-c new-window -c "#{pane_current_path}"
bind C-n next-window
bind C-p previous-window
bind C-w choose-tree -Zw
bind C-d detach-client
bind C-v split-window -h -c "#{pane_current_path}"
bind C-s split-window -v -c "#{pane_current_path}"
bind C-x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind C-z resize-pane -Z
bind C-f display-popup -E -w 60% -h 50% \
  "tmux list-windows -a -F '#S:#I  #W  (#{pane_current_command})' \
   | fzf --reverse --no-info | cut -d' ' -f1 | xargs -r tmux switch-client -t"

# Prefix ?: the cheat sheet, same as `cheat tmux` (replaces the default list-keys dump; that is
# still `:list-keys`).
bind ? display-popup -E -w 90% -h 80% "less -R ~/dotfiles/cheats/tmux.md"

# Status bar on top, under Ghostty's tab bar. Transparent so the background
# image shows; colours are ANSI slots so it follows the from-image theme.
# Session name left, windows after it, nothing on the right.
set -g status-position top
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=colour4,bold] #S #[fg=colour8,nobold]│ "
set -g status-left-length 30
set -g status-right ""
set -g status-justify left
setw -g window-status-separator ""
setw -g window-status-format "#[fg=colour8] #I #W "
setw -g window-status-current-format "#[fg=colour4,bold] #I #W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=white"
